<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fff7ed;color:#292524;font-family:Arial,sans-serif;">
    <div style="max-width:640px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #fed7aa;border-top:8px solid #f97316;">
      <p style="margin:0 0 8px;color:#c2410c;font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;">Storage reminder</p>
      <h1 style="margin:0 0 24px;font-size:28px;color:#9a3412;">$status</h1>
      <p style="font-size:16px;line-height:1.5;">The storage used by <strong>$directory</strong> has reached the warning level.</p>
      <table style="width:100%;border-collapse:collapse;margin:24px 0;font-size:15px;">
        <tr><td style="padding:12px 0;border-bottom:1px solid #fed7aa;color:#78716c;">Current usage</td><td style="padding:12px 0;border-bottom:1px solid #fed7aa;text-align:right;font-weight:bold;color:#c2410c;">$usage</td></tr>
        <tr><td style="padding:12px 0;border-bottom:1px solid #fed7aa;color:#78716c;">Warning limit</td><td style="padding:12px 0;border-bottom:1px solid #fed7aa;text-align:right;">$warning_limit</td></tr>
        <tr><td style="padding:12px 0;color:#78716c;">Limit exceeded</td><td style="padding:12px 0;text-align:right;">$limit_exceeded_limit</td></tr>
      </table>
      <p style="margin:0;color:#78716c;font-size:13px;">Please review and clean up storage when convenient.</p>
    </div>
  </body>
</html>
