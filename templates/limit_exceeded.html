<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fef2f2;color:#292524;font-family:Arial,sans-serif;">
    <div style="max-width:640px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #fecaca;border-top:8px solid #dc2626;">
      <p style="margin:0 0 8px;color:#b91c1c;font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;">Storage reminder</p>
      <h1 style="margin:0 0 24px;font-size:28px;color:#991b1b;">$status</h1>
      <p style="font-size:16px;line-height:1.5;">The storage used by <strong>$directory</strong> is above the configured limit.</p>
      <table style="width:100%;border-collapse:collapse;margin:24px 0;font-size:15px;">
        <tr><td style="padding:12px 0;border-bottom:1px solid #fecaca;color:#78716c;">Current usage</td><td style="padding:12px 0;border-bottom:1px solid #fecaca;text-align:right;font-weight:bold;color:#b91c1c;">$usage</td></tr>
        <tr><td style="padding:12px 0;border-bottom:1px solid #fecaca;color:#78716c;">Warning limit</td><td style="padding:12px 0;border-bottom:1px solid #fecaca;text-align:right;">$warning_limit</td></tr>
        <tr><td style="padding:12px 0;color:#78716c;">Limit exceeded</td><td style="padding:12px 0;text-align:right;">$limit_exceeded_limit</td></tr>
      </table>
      <p style="margin:0;color:#991b1b;font-size:15px;font-weight:bold;">Please take action to reduce storage usage.</p>
    </div>
  </body>
</html>
